<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Fish Monitoring Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0c1220; color: #e0e6ed; min-height: 100vh; }
        .header { background: rgba(16, 24, 44, 0.95); padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #1e88e5; }
        .header h1 { font-size: 1.5rem; }
        .header h1 i { color: #4fc3f7; margin-right: 0.5rem; }
        .status-dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 0.5rem; }
        .status-dot.connected { background: #4caf50; animation: pulse 2s infinite; }
        .status-dot.disconnected { background: #f44336; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .info-bar { display: flex; gap: 2rem; background: rgba(30, 136, 229, 0.1); border-radius: 12px; padding: 1rem; margin-bottom: 1.5rem; }
        .info-item { text-align: center; }
        .info-value { font-size: 1.5rem; font-weight: bold; color: #4fc3f7; }
        .info-label { font-size: 0.8rem; color: #90a4ae; }
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1.5rem; margin-bottom: 1.5rem; }
        .card { background: rgba(22, 33, 54, 0.9); border-radius: 12px; padding: 1.5rem; border: 1px solid rgba(30, 136, 229, 0.3); }
        .sensor-card { text-align: center; }
        .sensor-value { font-size: 3rem; font-weight: bold; margin: 0.5rem 0; }
        .sensor-value.temp { color: #ff7043; }
        .sensor-value.ph { color: #66bb6a; }
        .sensor-unit { font-size: 1rem; color: #78909c; }
        .sensor-label { font-size: 0.85rem; color: #90a4ae; margin-top: 0.5rem; }
        .chart-container { height: 250px; position: relative; }
        .device-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .device-item { display: flex; justify-content: space-between; padding: 0.75rem; background: rgba(30, 136, 229, 0.05); border-radius: 8px; border-left: 3px solid #1e88e5; }
        .no-data { color: #546e7a; text-align: center; padding: 2rem; font-style: italic; }
        canvas { width: 100% !important; height: 100% !important; }
    </style>
</head>
<body>
    <div class="header">
        <h1><i class="fas fa-fish"></i> IoT Fish Quality Monitor</h1>
        <div>
            <span class="status-dot connected" id="connDot"></span>
            <span id="connText">Connected</span>
        </div>
    </div>

    <div class="container">
        <div class="info-bar">
            <div class="info-item"><div class="info-value" id="totalDevices">0</div><div class="info-label">Active Devices</div></div>
            <div class="info-item"><div class="info-value" id="lastUpdate">--:--:--</div><div class="info-label">Last Update</div></div>
        </div>

        <div class="dashboard-grid">
            <div class="card sensor-card">
                <div style="color:#90a4ae"><i class="fas fa-thermometer-half"></i> TEMPERATURE</div>
                <div class="sensor-value temp" id="tempValue">--</div>
                <div class="sensor-unit">°C</div>
                <div class="sensor-label" id="tempDevice">Waiting for data...</div>
            </div>
            <div class="card sensor-card">
                <div style="color:#90a4ae"><i class="fas fa-flask"></i> pH LEVEL</div>
                <div class="sensor-value ph" id="phValue">--</div>
                <div class="sensor-unit">pH Scale</div>
                <div class="sensor-label" id="phDevice">Waiting for data...</div>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="card">
                <div style="color:#90a4ae;margin-bottom:0.5rem"><i class="fas fa-chart-line"></i> Temperature Trend</div>
                <canvas id="tempChart"></canvas>
            </div>
            <div class="card">
                <div style="color:#90a4ae;margin-bottom:0.5rem"><i class="fas fa-chart-line"></i> pH Trend</div>
                <canvas id="phChart"></canvas>
            </div>
        </div>

        <div class="card">
            <div style="color:#90a4ae;margin-bottom:0.5rem"><i class="fas fa-microchip"></i> Device Status</div>
            <div class="device-list" id="deviceList"><div class="no-data">No devices connected yet</div></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
    <script>
        const socket = io();
        let activeDevices = new Set();
        const maxPoints = 30;
        const labels = [], tempData = [], phData = [];

        const chartOpts = { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { ticks: { color: '#78909c', maxTicksLimit: 8 }, grid: { color: 'rgba(255,255,255,0.05)' } }, y: { ticks: { color: '#78909c' }, grid: { color: 'rgba(255,255,255,0.05)' } } }, animation: { duration: 400 } };

        new Chart(document.getElementById('tempChart'), { type: 'line', data: { labels, datasets: [{ data: tempData, borderColor: '#ff7043', backgroundColor: 'rgba(255,112,67,0.1)', fill: true, tension: 0.4 }] }, options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, suggestedMin: 20, suggestedMax: 35 } } } });
        new Chart(document.getElementById('phChart'), { type: 'line', data: { labels, datasets: [{ data: phData, borderColor: '#66bb6a', backgroundColor: 'rgba(102,187,106,0.1)', fill: true, tension: 0.4 }] }, options: { ...chartOpts, scales: { ...chartOpts.scales, y: { ...chartOpts.scales.y, min: 0, max: 14 } } } });

        socket.on('connect', () => { document.getElementById('connDot').className = 'status-dot connected'; document.getElementById('connText').textContent = 'Connected'; });
        socket.on('disconnect', () => { document.getElementById('connDot').className = 'status-dot disconnected'; document.getElementById('connText').textContent = 'Disconnected'; });

        socket.on('sensor-data', (d) => {
            const now = new Date().toLocaleTimeString('id-ID');
            labels.push(now); tempData.push(d.temperature); phData.push(d.ph);
            if (labels.length > maxPoints) { labels.shift(); tempData.shift(); phData.shift(); }
            document.getElementById('tempValue').textContent = d.temperature.toFixed(1);
            document.getElementById('phValue').textContent = d.ph.toFixed(2);
            document.getElementById('tempDevice').textContent = `Device: ${d.deviceId}`;
            document.getElementById('phDevice').textContent = `Device: ${d.deviceId}`;
            document.getElementById('lastUpdate').textContent = now;
            document.getElementById('totalDevices').textContent = activeDevices.size || 1;
            // Trigger chart update
            Chart.helpers.each(Chart.instances, (instance) => instance.update('none'));
        });

        socket.on('devices-list', (ids) => { ids.forEach(id => activeDevices.add(id)); refreshDevices(ids); });

        function refreshDevices(ids) {
            const el = document.getElementById('deviceList');
            el.innerHTML = ids.map(id => `<div class="device-item"><span><i class="fas fa-microchip"></i> ${id}</span><span style="color:#4caf50;font-size:0.8rem;padding:0.25rem 0.75rem;border-radius:15px;background:rgba(76,175,80,0.2)">Online</span></div>`).join('') || '<div class="no-data">No devices connected yet</div>';
        }
    </script>
</body>
</html>
