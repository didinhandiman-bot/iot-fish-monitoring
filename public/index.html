<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fish Monitoring Dashboard</title>
    <!-- Library External -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="/libs/socket.io.min.js"></script>
    <script src="/libs/chart.js.min.js"></script>
    
<!-- Force Fresh Load -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
    
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: system-ui, sans-serif; margin: 0; padding: 0; }
        .header { background: #161b22; padding: 1rem 2rem; border-bottom: 1px solid #30363d; display: flex; justify-content: space-between; align-items: center; }
        .status-badge { display: flex; align-items: center; gap: 8px; font-weight: 600; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background-color: #f85149; box-shadow: 0 0 5px #f85149; transition: 0.3s; }
        .dot.active { background-color: #2ea043; box-shadow: 0 0 8px #2ea043; }
        
        .container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
        .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; text-align: center; }
        .big-val { font-size: 2.5rem; font-weight: bold; margin: 0.5rem 0; }
        .label { color: #8b949e; font-size: 0.9rem; }
        
        .chart-box { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; height: 300px; position: relative; }
    </style>
</head>
<body>
    <div class="header">
        <h3><i class="fas fa-water"></i> KKP Fish Monitor</h3>
        <div class="status-badge">
            <span id="connDot" class="dot"></span>
            <span id="statusText">Disconnected</span>
        </div>
    </div>

    <div class="container">
        <!-- Info Cards -->
        <div class="cards">
            <div class="card">
                <div class="label">Temperatur Air</div>
                <div class="big-val" style="color: #ff7b72" id="valTemp">--</div>
                <small id="devTemp">Menunggu data...</small>
            </div>
            <div class="card">
                <div class="label">pH Level</div>
                <div class="big-val" style="color: #a5d6ff" id="valPH">--</div>
                <small id="devPH">Menunggu data...</small>
            </div>
            <div class="card">
                <div class="label">Status Jaringan</div>
                <div class="big-val" style="font-size: 1.5rem;" id="netInfo">Offline</div>
                <small>Devices: <span id="devCount">0</span></small>
            </div>
        </div>

        <!-- Charts -->
        <div class="cards">
            <div class="chart-box">
                <canvas id="chartTemp"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="chartPH"></canvas>
            </div>
        </div>
    </div>

    <script>
        // --- CONFIG & STATE ---
        
        const MAX_POINTS = 20; 
        const labels = [], tempData = [], phData = [];
        let devices = new Set();
        let chartInst = null, chartPhInst = null;
        
        // Pre-fill charts so they aren't empty on first load
        for(let i=1; i<=3; i++){
            const t = new Date(Date.now() - i*60000);
            labels.push(t.toLocaleTimeString('id-ID'));
            tempData.push(26.5 + (i%2)*0.2);
            phData.push(6.8 + (i%3)*0.05);
        }
        
        // Initialize charts with the pre-filled data
        const commonOpts = {
            responsive: true,
            maintainAspectRatio: false,
            animation: false,
            scales: { x: { ticks: { color: '#8b949e' } }, y: { ticks: { color: '#8b949e' } } },
            plugins: { legend: { labels: { color: '#c9d1d9' } } }
        };
        
        const ctxT = document.getElementById('chartTemp').getContext('2d');
        chartInst = new Chart(ctxT, {
            type: 'line',
            data: { labels: [...labels], datasets: [{ label: 'Temperature', data: [...tempData], borderColor: '#ff7b72', tension: 0.3 }] },
            options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, suggestedMin: 20, suggestedMax: 35 } } }
        });
        
        const ctxP = document.getElementById('chartPH').getContext('2d');
        chartPhInst = new Chart(ctxP, {
            type: 'line',
            data: { labels: [...labels], datasets: [{ label: 'pH Level', data: [...phData], borderColor: '#a5d6ff', tension: 0.3 }] },
            options: { ...commonOpts, scales: { ...commonOpts.scales, y: { ...commonOpts.scales.y, min: 0, max: 14 } } }
        });
        
        function updateCharts() {
            chartInst.data.labels = [...labels];
            chartPhInst.data.labels = [...labels];
            chartInst.update();
            chartPhInst.update();
        }
        
        console.log('[DASHBOARD] Initial chart data:', labels.length, 'points loaded.');
        
        // --- CONNECT TO SOCKET.IO ---
        const socket = io(window.location.origin, {
            transports: ['polling'], // TEMP: polling only untuk test connectivity
            reconnection: true,
            reconnectionAttempts: 5,
            reconnectionDelay: 2000,
            withCredentials: true
        });
        
        console.log('[DASHBOARD] Socket initialized with polling-first strategy');
        
        socket.on('connect', () => {
            console.log("✅ Connected!");
            document.getElementById('connDot').classList.add('active');
            document.getElementById('statusText').innerText = "Connected";
            
            // Hanya kirim ulang data terakhir yang tersimpan
            updateCharts();
        });

        socket.on('disconnect', () => {
            document.getElementById('connDot').classList.remove('active');
            document.getElementById('statusText').innerText = "Disconnected";
        });

        socket.on('sensor-data', (msg) => {
            const t = msg.temperature;
            const p = msg.ph;
            const dev = msg.deviceId;

            // Update UI Angka
            document.getElementById('valTemp').innerText = t.toFixed(1) + "°C";
            document.getElementById('valPH').innerText = p.toFixed(2);
            document.getElementById('devTemp').innerText = dev;
            document.getElementById('devPH').innerText = dev;
            devices.add(dev);
            document.getElementById('devCount').innerText = devices.size;
            document.getElementById('netInfo').innerText = "Online";

            // Update Grafik (PUSH DATA)
            const time = new Date().toLocaleTimeString('id-ID');
            labels.push(time);
            tempData.push(t);
            phData.push(p);

            // POP data lama jika melebihi batas (FIX GRAFIK MEMANJANG)
            if(labels.length > MAX_POINTS) {
                labels.shift();
                tempData.shift();
                phData.shift();
            }
            updateCharts();
        });

        // --- FALLBACK: API Polling Every 5s ---
        let lastFetchedData = null;
        setInterval(async () => {
            try {
                const resp = await fetch('/api/v1/sensors/all');
                const result = await resp.json();
                if (result.success && result.data.length > 0) {
                    const latest = result.data[result.data.length - 1];
                    if (JSON.stringify(latest) !== JSON.stringify(lastFetchedData)) {
                        // Update UI manually
                        document.getElementById('valTemp').innerText = latest.temperature.toFixed(1) + "°C";
                        document.getElementById('valPH').innerText = latest.ph.toFixed(2);
                        document.getElementById('devTemp').innerText = latest.deviceId;
                        document.getElementById('devPH').innerText = latest.deviceId;
                        document.getElementById('netInfo').innerText = "Syncing";
                        
                        // Add to chart
                        const time = new Date().toLocaleTimeString('id-ID');
                        labels.push(time);
                        tempData.push(latest.temperature);
                        phData.push(latest.ph);
                        
                        if(labels.length > MAX_POINTS) {
                            labels.shift();
                            tempData.shift();
                            phData.shift();
                        }
                        
                        updateCharts();
                        lastFetchedData = latest;
                        console.log('[API] Updated from direct fetch:', latest);
                    }
                }
            } catch(e) {
                console.error('[API Fetch Error]', e);
            }
        }, 5000); // Every 5 seconds
        
    </script>
</body>
</html>
